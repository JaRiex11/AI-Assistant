examples:
  - title: "Уязвимость Axios"
    text: "Уязвимость компонента Axios версий с 0.8.1 по 1.5.1. Позволяет злоумышленнику получить несанкционированный доступ к XSRF-TOKEN. Обновления на данный момент отсутствуют. Временное решение: отключите включение XSRF-TOKEN в HTTP-заголовок X-XSRF-TOKEN. Публичный эксплойт существует. CVE-2025-59287. Оценка 7,8. CVSS v2.0 AV:N/AC:L/Au:N/C:C/I:N/A:N. Последствия: удалённый доступ к конфиденциальной информации."
    source: "https://dbugs.ptsecurity.com/vulnerability/PT-2023-8832"
    output: |
      {
        "name": "уязвимость компонента Axios",
        "service": "Axios версий с 0.8.1 по 1.5.1",
        "description": "Уязвимость позволяет злоумышленнику получить несанкционированный доступ к XSRF-TOKEN, который хранится в cookie и включается в HTTP-заголовок X-XSRF-TOKEN для каждого запроса.",
        "update_available": "обновления на данный момент отсутствуют",
        "workaround": "отключите включение XSRF-TOKEN в HTTP-заголовок X-XSRF-TOKEN для каждого запроса",
        "exploit": "да, публичный эксплойт",
        "cve": "CVE-2025-59287",
        "cve_score": 7.8,
        "cvss": "CVSS v2.0 AV:N/AC:L/Au:N/C:C/I:N/A:N",
        "consequences": "удаленный доступ к конфиденциальной информации"
      }

  - title: "Уязвимость Confluence"
    text: "Уязвимость ПО Atlassian Confluence. Затронуты версии: prior to 7.4.17, 7.13.0–7.13.6, 7.14.0–7.14.2, 7.15.0–7.15.1, 7.16.0–7.16.3, 7.17.0–7.17.3, 7.18.0. Позволяет злоумышленнику без аутентификации выполнять произвольный код на сервере Confluence. Обновление: до 7.4.17 или новее. Временное решение: ограничение доступа к сервису через Интернет. Публичный эксплойт есть. CVE-2022-26134. Оценка 10,0. CVSS v3.1 AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H. Последствия: удалённое выполнение кода."
    source: "https://dbugs.ptsecurity.com/vulnerability/PT-2021-7092"
    output: |
      {
        "name": "уязвимость ПО Atlassian Confluence",
        "service": "Atlassian Confluence Server and Data Center: prior to 7.4.17, 7.13.0-7.13.6, 7.14.0-7.14.2, 7.15.0-7.15.1, 7.16.0-7.16.3, 7.17.0-7.17.3, 7.18.0",
        "description": "Уязвимость позволяет злоумышленнику без аутентификации выполнять произвольный код на сервере Confluence или в центре обработки данных.",
        "update_available": "обновить до 7.4.17, 7.13.7, 7.14.3, 7.15.2, 7.16.4, 7.17.4, 7.18.1 или новее",
        "workaround": "ограничение доступа к сервису через Интернет или блокировка ссылок, содержащих ${",
        "exploit": "да, публичный эксплойт",
        "cve": "CVE-2022-26134",
        "cve_score": 10.0,
        "cvss": "CVSS v3.1 AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H",
        "consequences": "удаленное выполнение кода"
      }

  - title: "Уязвимость WSUS"
    text: "Уязвимость в службах обновления Windows Server Update Services. Затронуты Windows Server 2012, 2012 R2, 2016, 2019, 2022, 2025 (включая Server Core). Уязвимость в обработчике SynchronizationUpdateErrorsKey позволяет злоумышленнику выполнять команды от имени администратора или системных учетных записей. Исправлено в patch Tuesday 14 октября 2025, дополнительные обновления 23 и 24 октября 2025. Временных решений нет. Эксплойта нет. CVE-2025-59287. Оценка 9,8. CVSS не указан. Последствия: запуск процесса с повышенными привилегиями."
    source: "https://securelist.ru/cve-2025-59287-wsus-exploitation-detection-in-ngfw-kes-kata-edr/114105/"
    output: |
      {
        "name": "уязвимость в службах обновления Windows Server Update Services",
        "service": "Windows Server 2012, 2012 R2, 2016, 2019, 2022, 2025 (включая Server Core)",
        "description": "Уязвимость в обработчике SynchronizationUpdateErrorsKey позволяет злоумышленнику выполнять команды от имени администратора или системных учетных записей.",
        "update_available": "исправлено в patch Tuesday 14 октября 2025, дополнительные обновления 23 и 24 октября 2025",
        "workaround": "отсутствует",
        "exploit": "нет",
        "cve": "CVE-2025-59287",
        "cve_score": 9.8,
        "cvss": null,
        "consequences": "запуск процесса с повышенными привилегиями"
      }

  - title: "Уязвимость GLPI"
    text: "Уязвимость ПО для управления активами и ИТ-инфраструктурой GLPI версий с 0.60 по 10.0.23. Аутентифицированный пользователь может сохранить полезную нагрузку XSS в полях поставщика. Обновить до 10.0.24 или новее. Временных решений нет. Эксплойта нет. CVE-2026-26027. Оценка 7,5. CVSS v2.0 AV:N/AC:L/Au:N/C:C/I:N/A:N. Последствия: удалённый доступ к конфиденциальной информации."
    source: "https://dbugs.ptsecurity.com/vulnerability/PT-2026-30609"
    output: |
      {
        "name": "уязвимость ПО для управления активами и ИТ-инфраструктурой GLPI",
        "service": "GLPI версий с 0.60 по 10.0.23",
        "description": "Аутентифицированный пользователь может сохранить полезную нагрузку XSS в полях поставщика.",
