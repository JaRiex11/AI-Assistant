# config/profile.yaml

# Какой профиль использовать сейчас: security | management
active: security

profiles:

  security:
    name: "Отдел безопасности"
    audience: tech
    description: |
      Технический специалист по ИБ. Интересуют уязвимости, эксплойты,
      атаки и действия группировок, инструменты и техники детекта.
      Важны конкретные CVE, затронутые системы, TTP и IOC.
      Фокус — на КИИ РФ: энергетика, промышленность, финансы.
      Регуляторика и менеджерские темы — второстепенны.

    focus_topics:
      - уязвимости и CVE
      - эксплойты и PoC
      - атаки и группировки
      - утечки данных
      - инструменты и техники детекта
      - КИИ: энергетика, промышленность, финансы

    angle:
      - "Есть ли CVE или идентификатор уязвимости?"
      - "Какие системы или продукты затронуты?"
      - "Есть ли публичный эксплойт или PoC?"
      - "Какие TTP, IOC или сигнатуры атаки?"
      - "Как детектить и митигировать?"
      - "Кто атакует — известная ли группировка?"

    tags_priority: [4, 5, 6, 8, 10]

    exclude:
      - "пресс-релизы без технических деталей"
      - "регуляторные новости без CVE"
      - "маркетинговые материалы вендоров"

  management:
    name: "Отдел управления"
    audience: exec
    description: |
      Руководитель или менеджер, отвечающий за ИБ-риски.
      Интересуют финансовые и репутационные последствия инцидентов,
      отраслевые тренды, регуляторные требования и штрафы.
      Важны цифры ущерба, пострадавшие отрасли и регионы,
      а также практические выводы для бизнеса.
      Технические детали (CVE, TTP) — второстепенны.

    focus_topics:
      - финансовые потери от инцидентов
      - репутационные риски
      - регуляторика и штрафы
      - инциденты в отраслях
      - тренды и прогнозы ИБ-рынка
      - КИИ: госсектор, финансы, промышленность

    angle:
      - "Какие финансовые потери?"
      - "Какая отрасль или регион пострадали?"
      - "Есть ли репутационные или имиджевые последствия?"
      - "Какие регуляторные последствия (штрафы, требования)?"
      - "Что делать бизнесу для защиты?"
      - "Это единичный случай или тренд?"

    tags_priority: [1, 3, 4, 7, 9]

    exclude:
      - "глубокие технические разборы CVE без бизнес-контекста"
      - "PoC и сигнатуры без упоминания последствий"
      - "материалы для пентестеров"