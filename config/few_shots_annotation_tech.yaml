examples:
  - type: "Атака"
    title: "Атака PhantomCore на организации промышленного сектора РФ"
    text: "Группировка PhantomCore атаковала промышленные предприятия РФ 8 апреля 2026 через фишинговые письма. Использовались KermitRAT, HTA-файл, PowerShell, Batch, MeshAgent. IoC опубликованы."
    extracted:
      country: "РФ"
      group: "PhantomCore"
      attack_date: "8 апреля 2026"
      sectors: "промышленный сектор"
      initial_access: "фишинговые письма"
      tools: ["KermitRAT", "HTA-файл", "PowerShell", "Batch", "MeshAgent"]
      cve: null
      ioc: true
    output: |
      Группировка PhantomCore атаковала промышленный сектор РФ 8 апреля 2026.
      Первоначальный доступ — фишинговые письма. Инструменты: KermitRAT,
      HTA-файл, PowerShell, Batch, MeshAgent. IoC опубликованы.

  - type: "Уязвимость"
    title: "Уязвимость Axios"
    text: "Уязвимость компонента Axios версий с 0.8.1 по 1.5.1. Позволяет получить несанкционированный доступ к XSRF-TOKEN. Публичный эксплойт существует. CVE-2025-59287. Оценка 7,8. Обновления на данный момент отсутствуют."
    extracted:
      name: "уязвимость компонента Axios"
      service: "Axios версий с 0.8.1 по 1.5.1"
      cve: "CVE-2025-59287"
      cve_score: 7.8
      exploit: "да, публичный эксплойт"
      update_available: "обновления на данный момент отсутствуют"
    output: |
      Уязвимость компонента Axios версий 0.8.1–1.5.1. Позволяет получить
      несанкционированный доступ к XSRF-TOKEN. Публичный эксплойт,
      CVE-2025-59287, оценка 7.8. Обновления нет.

  - type: "Инфо"
    title: "Минцифры планирует ввести оборотные штрафы за нарушение сроков перехода КИИ на отечественные IT-решения"
    text: "Министерство цифрового развития РФ готовит новый законопроект, который затронет предприятия, обслуживающие КИИ. Компании, не успевшие перейти на российские программные продукты, могут быть вынуждены ежегодно выплачивать оборотные штрафы."
    extracted: {}
    output: |
      Минцифры готовит законопроект об оборотных штрафах для предприятий
      КИИ, не успевших перейти на отечественные IT-решения. Регуляторное
      давление на критическую инфраструктуру усиливается.