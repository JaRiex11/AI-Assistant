examples:
  - type: "Атака"
    title: "Что известно про хакерскую атаку на «Аэрофлот»?"
    text: "28 июля «Аэрофлот» отменил около 50 рейсов из-за хакерской атаки, ответственность за которую взяли группировки «Киберпартизаны BY» и Silent Crow. Уничтожено 7000 серверов, скомпрометированы корпоративные системы, скопированы данные, ущерб оценивается в 260 млн рублей."
    extracted:
      country: "РФ"
      group: "Киберпартизаны BY, Silent Crow"
      attack_date: "28 июля 2025"
      sectors: "Аэрофлот, авиаперевозки"
    output: |
      28 июля «Аэрофлот» отменил около 50 рейсов из-за хакерской атаки.
      Ответственность взяли группировки «Киберпартизаны BY» и Silent Crow.
      Уничтожено 7000 серверов, скомпрометированы корпоративные системы,
      ущерб оценивается не менее чем в 260 млн рублей.

  - type: "Инфо"
    title: "Минцифры планирует ввести оборотные штрафы за нарушение сроков перехода КИИ на отечественные IT-решения"
    text: "Министерство цифрового развития РФ готовит новый законопроект, который затронет предприятия, обслуживающие критически важную информационную инфраструктуру. Компании, не успевшие перейти на российские программные продукты, могут быть вынуждены ежегодно выплачивать оборотные штрафы."
    extracted: {}
    output: |
      Минцифры готовит законопроект об оборотных штрафах для предприятий
      КИИ, не успевших перейти на отечественные IT-решения. Инициатива
      создаёт регуляторный риск для организаций, работающих с критической
      инфраструктурой.

  - type: "Уязвимость"
    title: "Уязвимость WSUS"
    text: "Уязвимость в службах обновления Windows Server Update Services. Затронуты Windows Server 2012, 2012 R2, 2016, 2019, 2022, 2025. Позволяет выполнять команды от имени администратора. Исправлено в patch Tuesday 14 октября 2025."
    extracted:
      name: "уязвимость в службах обновления Windows Server Update Services"
      service: "Windows Server 2012, 2012 R2, 2016, 2019, 2022, 2025"
      cve: "CVE-2025-59287"
      cve_score: 9.8
      exploit: "нет"
      update_available: "исправлено в patch Tuesday 14 октября 2025"
    output: |
      Уязвимость в службах обновления Windows Server с оценкой 9.8.
      Затронуты версии Windows Server 2012–2025, используемые в
      корпоративной инфраструктуре. Позволяет выполнять команды от имени
      администратора. Патч выпущен 14 октября 2025.