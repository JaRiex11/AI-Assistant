<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Дайджест</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
</head>
<body>

    <aside class="sidebar" id="sidebar"></aside>

    <main class="main-content center">
        <div class="hero">
            <div class="logo-circle" id="heroLogo">⚡</div>
            <h1 class="hero-title" id="heroTitle">Загрузка...</h1>
            <p class="hero-subtitle" id="heroSubtitle"></p>
        </div>

        <!-- Выбор типа дайджеста -->
        <div class="digest-type-selector">
            <button class="digest-type-card active" data-type="daily">
                <div class="digest-type-icon">🛡️</div>
                <div class="digest-type-title">Ежедневный</div>
                <div class="digest-type-desc">Для ИБ-специалистов: атаки, уязвимости, инциденты</div>
            </button>
            <button class="digest-type-card" data-type="monthly">
                <div class="digest-type-icon">📊</div>
                <div class="digest-type-title">Месячная выжимка</div>
                <div class="digest-type-desc">Для руководства: тренды, потери, регуляторика</div>
            </button>
        </div>

        <!-- Модель + кнопка генерации -->
        <div class="input-wrapper">
            <div class="input-toolbar">
                <div class="left-tools"></div>
                <div class="right-tools">
                    <button class="cloud-toggle" id="cloudToggle" title="Облачный режим">☁️</button>
                    <div class="model-dropdown-container">
                        <button class="model-selector" id="model-selector-btn">
                            <span id="selected-model-text"></span>
                            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M6 9l6 6 6-6"/>
                            </svg>
                        </button>
                        <div class="model-dropdown-menu" id="model-dropdown-menu"></div>
                    </div>
                    <button class="send-btn" id="generateBtn"></button>
                </div>
            </div>
        </div>

        <!-- Прогресс пайплайна (скрыт, пока не идёт генерация) -->
        <div class="progress-steps" id="progressSteps">
            <div class="progress-step" data-stage="collecting">
                <div class="progress-dot"></div>
                <span>Сбор публикаций</span>
            </div>
            <div class="progress-step" data-stage="dedup">
                <div class="progress-dot"></div>
                <span>Удаление дублей</span>
            </div>
            <div class="progress-step" data-stage="relevance">
                <div class="progress-dot"></div>
                <span>Фильтр релевантности</span>
            </div>
            <div class="progress-step" data-stage="classify">
                <div class="progress-dot"></div>
                <span>Классификация</span>
            </div>
            <div class="progress-step" data-stage="export">
                <div class="progress-dot"></div>
                <span>Формирование дайджеста</span>
            </div>
        </div>

        <!-- Результат (скрыт, показывается после генерации) -->
        <div class="digest-result" id="digestResult">
            <div class="digest-result-header">
                <div>
                    <div class="digest-result-title" id="resultTitle">Готовый дайджест</div>
                    <div class="digest-result-meta" id="resultMeta"></div>
                </div>
                <button class="btn btn-primary" id="downloadBtn">Скачать .md</button>
            </div>
            <div class="digest-result-body" id="digestBody"></div>
        </div>
    </main>

    <div class="modal-overlay" id="digestModal">
        <div class="modal" style="max-width: 720px;">
            <div class="modal-title">Готовый дайджест</div>
            <div class="modal-field">
                <label class="modal-label">Содержимое</label>
                <div id="digestBody"
                    style="max-height: 55vh; overflow-y: auto;
                            white-space: pre-wrap; font-family: monospace;
                            font-size: 12px; line-height: 1.6;
                            background: var(--bg); padding: 14px;
                            border: 1px solid var(--border-input);
                            border-radius: 10px;"></div>
            </div>
            <div class="modal-actions">
                <button class="btn btn-ghost" id="digestClose">Закрыть</button>
                <button class="btn btn-primary" id="digestDownload">Скачать .md</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast">
        <span id="toastIcon"></span>
        <span id="toastText"></span>
    </div>

    <script src="config.js"></script>
    <script src="storage.js"></script>
    <script src="ui.js"></script>
    <script src="api.js"></script>
    <script>
    /* ======================================================
       ИНИЦИАЛИЗАЦИЯ
       ====================================================== */
    applyTheme();
    renderSidebar('digest');

    document.title = CONFIG.domain.title;
    document.getElementById('heroLogo').textContent = CONFIG.brand.logo;
    document.getElementById('heroTitle').textContent = CONFIG.domain.title;
    document.getElementById('heroSubtitle').textContent = CONFIG.domain.subtitle;

    const generateBtn = document.getElementById('generateBtn');
    generateBtn.innerHTML = getIcon('sparkles');
    generateBtn.title = 'Сгенерировать дайджест';

    /* ======================================================
       ВЫБОР ТИПА ДАЙДЖЕСТА
       ====================================================== */
    let selectedType = 'daily';

    document.querySelectorAll('.digest-type-card').forEach(card => {
        card.addEventListener('click', () => {
            document.querySelectorAll('.digest-type-card').forEach(c => c.classList.remove('active'));
            card.classList.add('active');
            selectedType = card.dataset.type;
        });
    });

    /* ======================================================
       МОДЕЛЬ
       ====================================================== */
    const modelBtn = document.getElementById('model-selector-btn');
    const dropdownMenu = document.getElementById('model-dropdown-menu');
    const selectedText = document.getElementById('selected-model-text');

    dropdownMenu.innerHTML = CONFIG.models.map((m, i) => `
        <div class="model-option ${i === 0 ? 'active' : ''}" data-value="${escapeHtml(m.value)}">
            ${escapeHtml(m.label)}
        </div>
    `).join('');
    selectedText.textContent = CONFIG.models[0].value;

    modelBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        dropdownMenu.classList.toggle('show');
    });

    dropdownMenu.querySelectorAll('.model-option').forEach(option => {
        option.addEventListener('click', () => {
            dropdownMenu.querySelectorAll('.model-option').forEach(o => o.classList.remove('active'));
            option.classList.add('active');
            selectedText.textContent = option.getAttribute('data-value');
            dropdownMenu.classList.remove('show');
        });
    });

    document.addEventListener('click', (e) => {
        if (!modelBtn.contains(e.target) && !dropdownMenu.contains(e.target)) {
            dropdownMenu.classList.remove('show');
        }
    });

/*  ======================================================
        ТУМБЛЕР ОБЛАКО / ЛОКАЛЬНО
        ====================================================== */
    let cloudMode = CONFIG.cloud?.enabled !== false;
    const cloudToggle = document.getElementById('cloudToggle');

    function updateCloudToggle() {
        cloudToggle.classList.toggle('active', cloudMode);
        cloudToggle.title = cloudMode ? 'Облачный режим' : 'Локальный режим';
    }
    updateCloudToggle();

    cloudToggle.addEventListener('click', () => {
        cloudMode = !cloudMode;
        updateCloudToggle();
        showToast(cloudMode ? 'Облачный режим' : 'Локальный режим');
    });

    /*  ======================================================
        СОХРАНЕНИЕ АКТИВНОЙ ЗАДАЧИ
        ====================================================== */
    const ACTIVE_JOB_KEY = 'active_job';

    function saveActiveJob(data) {
        localStorage.setItem(ACTIVE_JOB_KEY, JSON.stringify(data));
    }
    function loadActiveJob() {
        try {
            return JSON.parse(localStorage.getItem(ACTIVE_JOB_KEY) || 'null');
        } catch { return null; }
    }
    function clearActiveJob() {
        localStorage.removeItem(ACTIVE_JOB_KEY);
    }


    /* ======================================================
       ГЕНЕРАЦИЯ
       ====================================================== */
    let lastDigestId = null;

    generateBtn.addEventListener('click', async () => {
        const baseModel = selectedText.textContent;
        // const model = cloudMode ? `${baseModel}-cloud` : baseModel;
        const isDaily = selectedType === 'daily';

        const params = {
            query: isDaily ? 'Ежедневный дайджест' : 'Месячная выжимка',
            type: isDaily ? 'daily' : 'monthly',
            model: selectedText.textContent,
            cloud: cloudMode,
            period: isDaily ? 1 : 30,
            profileId: isDaily ? 'security' : 'management',
        };

        // UI: спиннер
        const originalHtml = generateBtn.innerHTML;
        generateBtn.disabled = true;
        generateBtn.innerHTML = '<div class="spinner"></div>';

        // Показываем прогресс, скрываем прошлый результат
        const progressEl = document.getElementById('progressSteps');
        document.getElementById('digestResult').classList.remove('show');
        resetProgress();
        progressEl.classList.add('show');

        showToast('Генерация запущена...');

        try {
            const digest = await API.generateDigest({
                ...params,
                onStage: (stage) => updateProgress(stage),
                onJobCreated: (id) => saveActiveJob({
                    jobId: id,
                    type: params.type,
                    model: params.model,
                    cloud: params.cloud,
                }),
            });
            clearActiveJob();

            // Прячем прогресс, показываем результат
            progressEl.classList.remove('show');
            document.getElementById('resultTitle').textContent =
                isDaily ? 'Ежедневный дайджест' : 'Месячная выжимка';
            document.getElementById('resultMeta').textContent =
                `Модель: ${digest.model || model} · Публикаций: ${digest.articlesCount || 0}`;
            document.getElementById('digestBody').innerHTML =
                marked.parse(digest.preview || '*(пусто)*');
            document.getElementById('digestResult').classList.add('show');
            document.getElementById('digestResult').scrollIntoView({ behavior: 'smooth' });

            showToast('Дайджест готов');
        } catch (err) {
            clearActiveJob();
            progressEl.classList.remove('show');
            showToast('Ошибка: ' + (err.message || 'неизвестная'), true);
        } finally {
            generateBtn.innerHTML = originalHtml;
            generateBtn.disabled = false;
        }
    });

    /* ======================================================
    ПРОГРЕСС-БАР
    ====================================================== */
    const STAGE_ORDER = ['collecting', 'dedup', 'relevance', 'classify', 'export'];

    function resetProgress() {
        document.querySelectorAll('.progress-step').forEach(el => {
            el.classList.remove('active', 'done');
        });
        // Первый шаг сразу активен
        const first = document.querySelector('.progress-step[data-stage="collecting"]');
        if (first) first.classList.add('active');
    }

    function updateProgress(currentStage) {
        if (currentStage === 'done') {
            document.querySelectorAll('.progress-step').forEach(el => {
                el.classList.remove('active');
                el.classList.add('done');
            });
            return;
        }

        const idx = STAGE_ORDER.indexOf(currentStage);
        if (idx === -1) return;

        document.querySelectorAll('.progress-step').forEach(el => {
            const stage = el.dataset.stage;
            const stageIdx = STAGE_ORDER.indexOf(stage);

            el.classList.toggle('done', stageIdx < idx);
            el.classList.toggle('active', stageIdx === idx);
        });
    }
    
    /* ======================================================
       СКАЧИВАНИЕ
       ====================================================== */
    document.getElementById('downloadBtn').addEventListener('click', async () => {
        if (!lastDigestId) return;
        try {
            const { blob, filename } = await API.downloadDigest(lastDigestId, 'md');
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = filename;
            a.click();
            URL.revokeObjectURL(a.href);
            showToast('Файл скачан');
        } catch (err) {
            showToast('Ошибка скачивания: ' + err.message, true);
        }
    });

    /*  ======================================================
        ВОССТАНОВЛЕНИЕ АКТИВНОЙ ГЕНЕРАЦИИ
        ====================================================== */
    (async function resumeActiveJob() {
        const active = loadActiveJob();
        if (!active || !active.jobId) return;

        // Показать тип и модель, которые были выбраны
        if (active.type) {
            selectedType = active.type;
            document.querySelectorAll('.digest-type-card').forEach(c => {
                c.classList.toggle('active', c.dataset.type === active.type);
            });
        }
        if (active.model) {
            selectedText.textContent = active.model;
            dropdownMenu.querySelectorAll('.model-option').forEach(o => {
                o.classList.toggle('active', o.dataset.value === active.model);
            });
        }

        // Показать прогресс
        const progressEl = document.getElementById('progressSteps');
        resetProgress();
        progressEl.classList.add('show');

        const originalHtml = generateBtn.innerHTML;
        generateBtn.disabled = true;
        generateBtn.innerHTML = '<div class="spinner"></div>';
        showToast('Восстанавливаем состояние генерации...');

        try {
            const digest = await API.resumeGeneration(active.jobId, {
                onStage: (stage) => updateProgress(stage),
            });

            clearActiveJob();
            progressEl.classList.remove('show');

            document.getElementById('resultTitle').textContent =
                active.type === 'monthly' ? 'Месячная выжимка' : 'Ежедневный дайджест';
            document.getElementById('resultMeta').textContent =
                `Модель: ${digest.model || active.model || '—'} · Публикаций: ${digest.articlesCount || 0}`;
            document.getElementById('digestBody').innerHTML =
                marked.parse(digest.preview || '*(пусто)*');
            document.getElementById('digestResult').classList.add('show');

            showToast('Дайджест готов');
        } catch (err) {
            clearActiveJob();
            progressEl.classList.remove('show');
            showToast('Ошибка: ' + err.message, true);
        } finally {
            generateBtn.innerHTML = originalHtml;
            generateBtn.disabled = false;
        }
    })();
</script>

</body>
</html>
