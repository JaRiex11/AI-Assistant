<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Дайджест</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
</head>
<body>

    <aside class="sidebar" id="sidebar"></aside>

    <main class="main-content center">
        <div class="hero">
            <div class="logo-circle" id="heroLogo">⚡</div>
            <h1 class="hero-title" id="heroTitle">Загрузка...</h1>
            <p class="hero-subtitle" id="heroSubtitle"></p>
        </div>

        <!-- Выбор типа дайджеста -->
        <div class="digest-type-selector">
            <button class="digest-type-card active" data-type="daily">
                <div class="digest-type-icon">🛡️</div>
                <div class="digest-type-title">Ежедневный</div>
                <div class="digest-type-desc">Для ИБ-специалистов: атаки, уязвимости, инциденты</div>
            </button>
            <button class="digest-type-card" data-type="monthly">
                <div class="digest-type-icon">📊</div>
                <div class="digest-type-title">Месячная выжимка</div>
                <div class="digest-type-desc">Для руководства: тренды, потери, регуляторика</div>
            </button>
        </div>

        <!-- Модель + кнопка генерации -->
        <div class="input-wrapper">
            <div class="input-toolbar">
                <div class="left-tools"></div>
                <div class="right-tools">
                    <div class="model-dropdown-container">
                        <button class="model-selector" id="model-selector-btn">
                            <span id="selected-model-text"></span>
                            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M6 9l6 6 6-6"/>
                            </svg>
                        </button>
                        <div class="model-dropdown-menu" id="model-dropdown-menu"></div>
                    </div>
                    <button class="send-btn" id="generateBtn"></button>
                </div>
            </div>
        </div>

        <!-- Результат (скрыт, показывается после генерации) -->
        <div class="digest-result" id="digestResult">
            <div class="digest-result-header">
                <div>
                    <div class="digest-result-title" id="resultTitle">Готовый дайджест</div>
                    <div class="digest-result-meta" id="resultMeta"></div>
                </div>
                <button class="btn btn-primary" id="downloadBtn">Скачать .md</button>
            </div>
            <div class="digest-result-body" id="digestBody"></div>
        </div>
    </main>

    <div class="modal-overlay" id="digestModal">
        <div class="modal" style="max-width: 720px;">
            <div class="modal-title">Готовый дайджест</div>
            <div class="modal-field">
                <label class="modal-label">Содержимое</label>
                <div id="digestBody"
                    style="max-height: 55vh; overflow-y: auto;
                            white-space: pre-wrap; font-family: monospace;
                            font-size: 12px; line-height: 1.6;
                            background: var(--bg); padding: 14px;
                            border: 1px solid var(--border-input);
                            border-radius: 10px;"></div>
            </div>
            <div class="modal-actions">
                <button class="btn btn-ghost" id="digestClose">Закрыть</button>
                <button class="btn btn-primary" id="digestDownload">Скачать .md</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast">
        <span id="toastIcon"></span>
        <span id="toastText"></span>
    </div>

    <script src="config.js"></script>
    <script src="storage.js"></script>
    <script src="ui.js"></script>
    <script src="api.js"></script>
    <script>
    /* ======================================================
       ИНИЦИАЛИЗАЦИЯ
       ====================================================== */
    applyTheme();
    renderSidebar('digest');

    document.title = CONFIG.domain.title;
    document.getElementById('heroLogo').textContent = CONFIG.brand.logo;
    document.getElementById('heroTitle').textContent = CONFIG.domain.title;
    document.getElementById('heroSubtitle').textContent = CONFIG.domain.subtitle;

    const generateBtn = document.getElementById('generateBtn');
    generateBtn.innerHTML = getIcon('sparkles');
    generateBtn.title = 'Сгенерировать дайджест';

    /* ======================================================
       ВЫБОР ТИПА ДАЙДЖЕСТА
       ====================================================== */
    let selectedType = 'daily';

    document.querySelectorAll('.digest-type-card').forEach(card => {
        card.addEventListener('click', () => {
            document.querySelectorAll('.digest-type-card').forEach(c => c.classList.remove('active'));
            card.classList.add('active');
            selectedType = card.dataset.type;
        });
    });

    /* ======================================================
       МОДЕЛЬ
       ====================================================== */
    const modelBtn = document.getElementById('model-selector-btn');
    const dropdownMenu = document.getElementById('model-dropdown-menu');
    const selectedText = document.getElementById('selected-model-text');

    dropdownMenu.innerHTML = CONFIG.models.map((m, i) => `
        <div class="model-option ${i === 0 ? 'active' : ''}" data-value="${escapeHtml(m.value)}">
            ${escapeHtml(m.label)}
        </div>
    `).join('');
    selectedText.textContent = CONFIG.models[0].value;

    modelBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        dropdownMenu.classList.toggle('show');
    });

    dropdownMenu.querySelectorAll('.model-option').forEach(option => {
        option.addEventListener('click', () => {
            dropdownMenu.querySelectorAll('.model-option').forEach(o => o.classList.remove('active'));
            option.classList.add('active');
            selectedText.textContent = option.getAttribute('data-value');
            dropdownMenu.classList.remove('show');
        });
    });

    document.addEventListener('click', (e) => {
        if (!modelBtn.contains(e.target) && !dropdownMenu.contains(e.target)) {
            dropdownMenu.classList.remove('show');
        }
    });

    /* ======================================================
       ГЕНЕРАЦИЯ
       ====================================================== */
    let lastDigestId = null;

    generateBtn.addEventListener('click', async () => {
        const model = selectedText.textContent;
        const isDaily = selectedType === 'daily';

        const params = {
            query: isDaily ? 'Ежедневный дайджест' : 'Месячная выжимка',
            model,
            period: isDaily ? 1 : 30,
            profileId: isDaily ? 'security' : 'management',
        };

        // UI: спиннер
        const originalHtml = generateBtn.innerHTML;
        generateBtn.disabled = true;
        generateBtn.innerHTML = '<div class="spinner"></div>';

        // Скрыть прошлый результат
        document.getElementById('digestResult').classList.remove('show');

        showToast('Генерация запущена...');

        try {
            const digest = await API.generateDigest(params);

            lastDigestId = digest.id;
            document.getElementById('resultTitle').textContent =
                isDaily ? 'Ежедневный дайджест' : 'Месячная выжимка';
            document.getElementById('resultMeta').textContent =
                `Модель: ${digest.model || model} · Публикаций: ${digest.articlesCount || 0}`;
            document.getElementById('digestBody').innerHTML =
                marked.parse(digest.preview || '*(пусто)*');
            document.getElementById('digestResult').classList.add('show');
            document.getElementById('digestResult').scrollIntoView({ behavior: 'smooth' });

            showToast('Дайджест готов');
        } catch (err) {
            showToast('Ошибка: ' + (err.message || 'неизвестная'), true);
        } finally {
            generateBtn.innerHTML = originalHtml;
            generateBtn.disabled = false;
        }
    });

    /* ======================================================
       СКАЧИВАНИЕ
       ====================================================== */
    document.getElementById('downloadBtn').addEventListener('click', async () => {
        if (!lastDigestId) return;
        try {
            const { blob, filename } = await API.downloadDigest(lastDigestId, 'md');
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = filename;
            a.click();
            URL.revokeObjectURL(a.href);
            showToast('Файл скачан');
        } catch (err) {
            showToast('Ошибка скачивания: ' + err.message, true);
        }
    });
</script>

</body>
</html>
